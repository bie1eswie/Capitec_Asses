<section class="card" style="max-width:680px;text-align:center;margin:auto"><div style="font-size:54px;color:var(--green)">✓</div><h1>Appointment booked!</h1><p class="muted">Your booking is confirmed. Notifications are simulated and no real SMS or email is sent.</p><div class="booking-summary"><div><span>Reference</span><strong>{{appointment()?.reference}}</strong></div><div><span>Date</span><strong>{{appointment()?.startsAt | date:'dd MMM yyyy, HH:mm':'+0200'}} SAST</strong></div><div><span>Status</span><span class="pill">{{appointment()?.status}}</span></div></div><button class="btn" (click)="appointmentsRequested.emit()">View my appointments</button></section>
