        <div class="grid two section">@for(item of appointments();track item.id){<article class="card"><div class="row"><span class="pill">{{item.status}}</span><span class="muted mini">{{item.reference}}</span></div><h2 style="margin-top:20px">Branch appointment</h2><p class="muted">{{item.startsAt | date:'EEE, dd MMM yyyy · HH:mm':'+0200'}} SAST</p><div class="row section"><button class="btn outline" [disabled]="busy() || item.status!=='Confirmed'" (click)="rescheduleRequested.emit(item)">Reschedule</button><button class="btn danger" [disabled]="busy() || item.status!=='Confirmed'" (click)="cancelRequested.emit(item)">Cancel</button></div></article>}</div>
        @if (!busy()&&appointments().length===0){<div class="empty section"><h2>No appointments yet</h2><p>Your confirmed branch visits will appear here.</p><button class="btn" (click)="newRequested.emit()">Book an appointment</button></div>}
