name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build --configuration Release --no-restore

      - name: Test
        run: |
          dotnet test --configuration Release --no-build --verbosity normal || true

      - name: Publish API (artifact)
        if: github.event_name == 'push'
        run: |
          dotnet publish src/Bams.Api/Bams.Api.csproj -c Release -o out/publish
          tar -czf bams-api-publish.tar.gz -C out/publish .
        shell: bash
      - name: Upload artifact
        if: github.event_name == 'push'
        uses: actions/upload-artifact@v4
        with:
          name: bams-api-publish
          path: bams-api-publish.tar.gz
